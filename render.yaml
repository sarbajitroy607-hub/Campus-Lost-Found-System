services:
  - type: web
    name: campus-lost-found-api
    runtime: node
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_NAME
        value: campus_lf
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRATION_TTL
        value: "86400"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_FIRSTNAME
        value: Campus
      - key: ADMIN_LASTNAME
        value: Admin
      - key: CORS_ORIGINS
        sync: false
